name: CI

on:
  push:
  workflow_dispatch:

# Superseded runs on the same branch are pointless once a newer push lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    # Browsers and system deps are baked in; the tag must track @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.45.2-jammy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Run Playwright tests
        run: npx playwright test --reporter=github,html

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            e2e/test-results/
          retention-days: 7
